name: Release

on:
  workflow_dispatch:
    inputs:
      previousVersion:
        description: 'Previous Version (no v prefix; must equal last tag, e.g. 1.4.1)'
        required: true
      version:
        description: 'Version (no v prefix; e.g. 1.4.2)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for gh release create/upload with GITHUB_TOKEN
      packages: write
    env:
      LAST_TAG: v${{ github.event.inputs.previousVersion }}
      CURRENT_TAG: v${{ github.event.inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # we need history for changelog

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compute release type vars
        id: rel
        run: |
          TAG="${CURRENT_TAG}"

          # default
          RELEASE_TYPE="stable"
          PRERELEASE_FLAG=""

          case "$TAG" in
            *-alpha*) RELEASE_TYPE="alpha"; PRERELEASE_FLAG="--prerelease" ;;
            *-beta*)  RELEASE_TYPE="beta";  PRERELEASE_FLAG="--prerelease" ;;
            *-pre*)   RELEASE_TYPE="pre";   PRERELEASE_FLAG="--prerelease" ;;
            *-rc*)    RELEASE_TYPE="rc";    PRERELEASE_FLAG="--prerelease" ;;
          esac

          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "prerelease_flag=$PRERELEASE_FLAG" >> "$GITHUB_OUTPUT"

      - name: Read project versions
        id: versions
        run: |
          MC_VERSION=$(grep -m1 '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          CORE_VERSION=$(grep -m1 '^advancedchat_version=' gradle.properties | cut -d'=' -f2)
          echo "minecraft_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "MINECRAFT_VERSION=$MC_VERSION" >> "$GITHUB_ENV"

      - name: Fetch AdvancedChatCore dependency jar
        run: |
          set -euo pipefail
          MC_VERSION="${{ steps.versions.outputs.minecraft_version }}"
          CORE_VERSION="${{ steps.versions.outputs.core_version }}"
          CORE_TAG="v${MC_VERSION}-${CORE_VERSION}"
          CORE_JAR="AdvancedChatCore-${MC_VERSION}-${CORE_VERSION}.jar"
          mkdir -p ../AdvancedChatCore-Update/build/libs
          curl -sfL \
            "https://github.com/ThePro1604/AdvancedChatCore-Update/releases/download/${CORE_TAG}/${CORE_JAR}" \
            -o "../AdvancedChatCore-Update/build/libs/${CORE_JAR}"

      - name: Build with Gradle
        id: build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          MOD_VERSION: ${{ github.event.inputs.version }}
        run: |
          # This project builds directly against Mojang's official mappings,
          # so there is no separate remap step - `build` produces the final jar.
          ./gradlew build -PcurrentTag="${CURRENT_TAG}" -PlastTag="${LAST_TAG}" --stacktrace

          # Pick first JAR and strip leading $PWD/
          FILE=$(find build/libs -maxdepth 1 -type f -name '*.jar' | head -n1)
          if [ -z "$FILE" ]; then
          echo "No JARs found in build/libs" >&2
          exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create tag for new version
        run: |
          git tag $CURRENT_TAG
          git push origin $CURRENT_TAG

      - name: Generate changelog (lines starting with '- ')
        id: changelog
        run: |
          set -euo pipefail
          # safety if tags missing remotely
          git fetch --tags

          # Extract commit bodies between tags, keep only bullet lines "- ..."
          # Limit depth similar to your script; adjust if needed
          MAX_COMMITS=${{ vars.CHANGELOG_MAX_COMMIT_SEARCH || 256 }}
          git log --max-count="${MAX_COMMITS}" --pretty=format:"%b" "${LAST_TAG}..${CURRENT_TAG}" \
            | sed 's/^"//; s/"$//' \
            | awk '/^- / {print}' > CHANGELOG_GH.txt

          # Fallback if empty
          if [ ! -s CHANGELOG_GH.txt ]; then
            echo "No Changelog Available" > CHANGELOG_GH.txt
          fi

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          cat CHANGELOG_GH.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ---- Optional: Publish to Modrinth via their action (recommended) ----
      # Disabled: requires the MODRINTH_TOKEN secret and MODRINTH_PROJECT_ID repo
      # variable, neither of which is configured yet. Set both, then flip this
      # back to `if: true` (or remove the condition) to re-enable.
      - name: Publish to Modrinth
        if: false
        uses: cloudnode-pro/modrinth-publish@v2.1.3
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}
          version: ${{ env.CURRENT_TAG }}
          changelog: ${{ steps.changelog.outputs.changelog }}
          game-versions: ${{ vars.MINECRAFT_VERSION }}
          files: ${{ steps.build.outputs.file }}
          loaders: |-
            fabric
            quilt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Create (or edit if exists)
          if gh release view "${CURRENT_TAG}" >/dev/null 2>&1; then
            echo "Release exists; editing title/notes..."
            gh release edit "${CURRENT_TAG}" \
              --title "${{ github.event.repository.name }} ${{ env.CURRENT_TAG }} for ${{ env.MINECRAFT_VERSION }}" \
              --notes-file CHANGELOG_GH.txt \
              --target "${GITHUB_SHA}" \
              ${{ steps.rel.outputs.prerelease_flag }}
          else
            echo "Creating release..."
            gh release create "${CURRENT_TAG}" \
              --title "${{ github.event.repository.name }} ${{ env.CURRENT_TAG }} for ${{ env.MINECRAFT_VERSION }}" \
              --notes-file CHANGELOG_GH.txt \
              --target "${GITHUB_SHA}" \
              ${{ steps.rel.outputs.prerelease_flag }}
          fi

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${CURRENT_TAG}" "${{ steps.build.outputs.file }}" --clobber

      - name: Upload build artifacts (CI archive)
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/