import java.time.ZonedDateTime
import java.time.format.DateTimeFormatter
import java.time.ZoneOffset

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "io.freefair.lombok" version "9.5.0"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// read version from env if provided by CI
def envModVersion = System.getenv('MOD_VERSION')?.trim()

// single UTC timestamp (safe for Maven repos; use '-' not '+')
def ts = ZonedDateTime.now(ZoneOffset.UTC).format(DateTimeFormatter.ofPattern('yyyyMMdd-HHmm'))

def modVersion = envModVersion ?: ts

base {
    archivesName = project.archives_base_name
}
version = "${project.minecraft_version}-${project.mod_version}"
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://masa.dy.fi/maven' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.fallenbreath.me/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.github.sakura-ryoko:malilib:${project.malilib_version}"
    // Local AdvancedChatCore build (avoids GitHub Packages auth)
    implementation files("../AdvancedChatCore-Update/build/libs/AdvancedChatCore-${project.minecraft_version}-${project.advancedchat_version}.jar")
    implementation 'com.github.DarkKronicle.Konstruct:core:2.0.3-build1'

	implementation 'org.openjdk.nashorn:nashorn-core:15.3'
	implementation 'org.javadelight:delight-nashorn-sandbox:0.2.5'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

jar {
    from "LICENSE.txt"
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(jar) {
                builtBy jar
            }
            artifact(sourcesJar) {
                builtBy sourcesJar
            }
        }
    }
    repositories {
    }
}
